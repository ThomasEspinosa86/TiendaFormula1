<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zona DRS | Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="loginyregistro.css" rel="stylesheet">
</head>
<body>

  <main class="auth">
 
    <aside class="auth-brand">
      <a class="auth-logo" href="../../index.html" aria-label="Zona DRS, volver al inicio">Zona <span>DRS</span></a>
      <h1 class="auth-title">Vuelva a la pista</h1>
      <p class="auth-lead">Inicie sesión y llegue primero a la colección oficial de todas las escuderías.</p>
    </aside>
 
    <section class="auth-panel" aria-labelledby="titulo-login">
      <article class="auth-card">
 
        <header class="auth-card-header">
          <h2 id="titulo-login">Iniciar sesión</h2>
          <p>Ingrese sus datos para continuar.</p>
        </header>
 
         <!--  aquí pon la lógica del login (validar datos y cambiar el action="#"). Los id y name son los ganchos -->
      

        <form id="form-login" action="#" method="post">

 
          <!--  bro mira aquí quita el hidden para mostrar este error si los datos están mal -->
          <output id="login-mensaje" class="auth-alert" role="alert" hidden>
            Correo o contraseña incorrectos.
          </output>
 
          <fieldset>
            <legend>Sus datos</legend>
 
            <p class="campo">
              <label for="login-correo">Correo electrónico</label>
              <input type="email" class="form-control" id="login-correo" name="correo"
                     placeholder="correo@ejemplo.com" autocomplete="email" required>
            </p>
 
            <p class="campo">
              <label for="login-password">Contraseña</label>
              <span class="input-group">
                <input type="password" class="form-control" id="login-password" name="password"
                       placeholder="Ingrese su contraseña" autocomplete="current-password" required>
                
              <!--  bro mira aquí pon la lógica de ver contraseña (cambiar el type entre password y text) -->


                <button type="button" class="btn-ver" id="btn-ver-login-password"
                        aria-label="Mostrar contraseña" aria-pressed="false" data-funcion="ver-password" data-objetivo="login-password">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </span>
            </p>
          </fieldset>
 
          <button type="submit" class="btn-auth">Iniciar sesión</button>
        </form>
 
        <footer class="auth-card-footer">
          <p>¿Aún no tiene cuenta? <a href="registro.html">Regístrese</a></p>
        </footer>
 
      </article>
    </section>
 
  </main>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- bro mira aquí: enlaza el JS del login -->
</body>
</html>
